name: 🐞 Bug Report / 버그 신고
description: 결함 또는 예상치 못한 동작 신고 / Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그 신고에 시간을 내주셔서 감사합니다. 가능한 한 자세히 알려주시면 빠르게 재현하고 수정할 수 있습니다.

        *Thanks for taking the time to file a bug report. The more detail you provide, the faster we can reproduce and fix it.*

  - type: textarea
    id: description
    attributes:
      label: 무엇이 잘못되었나요? / What went wrong?
      description: 결함의 증상을 간결히 설명해주세요. / Describe the bug briefly.
      placeholder: 예) 캠페인 생성 후 영상 첨부 시 ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차 / Reproduction steps
      description: 단계별로 알려주세요. / Step-by-step reproduction.
      placeholder: |
        1. 캠페인 생성
        2. 랜딩 페이지에 영상 첨부
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작 / Expected behavior
      description: 어떻게 동작해야 하나요? / What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 / Actual behavior
      description: 실제로는 어떻게 됐나요? / What actually happened?

  - type: input
    id: version
    attributes:
      label: AegisCampus 버전 / AegisCampus version
      placeholder: 예) v1.0.0-beta2
    validations:
      required: true

  - type: dropdown
    id: db
    attributes:
      label: 데이터베이스 / Database
      options:
        - SQLite3
        - MySQL
        - 기타 / Other
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 운영 환경 / Environment
      placeholder: 예) Ubuntu 22.04, Go 1.23.4, Node 20.x
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그 / Relevant logs
      description: 가능한 경우 로그를 붙여주세요. 민감 정보 제거 후 첨부. / Paste relevant logs if available, with sensitive data redacted.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 추가 컨텍스트 / Additional context
      description: 스크린샷, 설정 파일 등 / Screenshots, config snippets, etc.
