name: 💡 Feature Request / 기능 제안
description: 새로운 기능 또는 개선 제안 / Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안에 시간을 내주셔서 감사합니다. 어떤 문제를 해결하려는지 알려주시면 가장 적합한 형태로 검토할 수 있습니다.

        *Thanks for taking the time to suggest a feature. Telling us what problem it solves helps us evaluate the best shape for it.*

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제 / Problem to solve
      description: 어떤 상황에서 이 기능이 필요한가요? 누가 영향을 받나요? / What problem does this solve and who is affected?
      placeholder: 예) 캠페인 운영자가 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책 / Proposed solution
      description: 어떻게 해결되면 좋을지 설명해주세요. / Describe how it should be solved.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안 / Alternatives considered
      description: 다른 방법은 어떤 게 있나요? 왜 제안된 방법이 더 좋은가요? / What other approaches did you consider?

  - type: dropdown
    id: scope
    attributes:
      label: 영향 범위 / Scope
      options:
        - UI/UX
        - API
        - 데이터베이스 / Database
        - 캠페인 / Campaign
        - 영상 / Video
        - 메일 / Email
        - 보안 / Security
        - 빌드/배포 / Build & deploy
        - 기타 / Other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 추가 컨텍스트 / Additional context
      description: 스크린샷, 외부 참고 자료, 관련 이슈 등 / Screenshots, external references, related issues, etc.
