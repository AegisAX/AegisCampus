enable_ufw_firewall: true

install_packages:
  - postfix
  - unzip
  - libcap2-bin
  - python-is-python3
  - python3-pip

hostname: aegiscampus
aegiscampus_user: ubuntu
postfix_hostname: aegiscampus
postfix_inet_interfaces: 127.0.0.1
aegiscampus_domain: aegiscampus.local
aegiscampus_ssl_cert_path: /etc/ssl/private/aegiscampus.pem
aegiscampus_csr_path: /etc/ssl/csr/aegiscampus.csr
aegiscampus_crt_path: /etc/ssl/crt/aegiscampus.crt
# Required if changing /etc/hostname to something different.
reboot_box: true
