- name: Change /etc/hostname
  hostname:
    name: "{{ hostname }}"

- name: Ensure ufw is installed on the machine
  package:
    name: ufw
    state: present

- name: Allow TCP 22 for SSH.
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow TCP 80 for Sentinel.
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow TCP 443 for Sentinel.
  ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable ufw.
  ufw:
    state: enabled
    policy: deny
  when: enable_ufw_firewall

- name: Update APT package cache.
  apt:
    update_cache: yes

- name: Upgrade APT to the latest packages.
  apt:
    upgrade: safe

- name: Ensure /etc/ssl/csr folder exists
  file:
    path: /etc/ssl/csr
    state: directory
    mode: "0755"

- name: Ensure /etc/ssl/private folder exists
  file:
    path: /etc/ssl/private
    state: directory
    mode: "0755"

- name: Ensure /etc/ssl/crt folder exists
  file:
    path: /etc/ssl/crt
    state: directory
    mode: "0755"

- name: Install specified packages.
  apt:
    pkg: "{{ install_packages }}"
    state: latest

- name: adding existing user '{{ sentinel_user }}' to group ssl-cert
  user:
    name: "{{ sentinel_user }}"
    groups: ssl-cert
    append: yes

- name: Ensure the cryptography Python package is installed
  pip:
    name: cryptography

- name: Generate an OpenSSL private key with the default values (4096 bits, RSA)
  openssl_privatekey:
    path: "{{ sentinel_ssl_cert_path }}"

- name: Generate an OpenSSL Certificate Signing Request
  openssl_csr:
    path: "{{ sentinel_csr_path }}"
    privatekey_path: "{{ sentinel_ssl_cert_path }}"
    common_name: "{{ sentinel_domain }}"

- name: Generate a Self Signed OpenSSL certificate
  openssl_certificate:
    path: "{{ sentinel_crt_path }}"
    privatekey_path: "{{ sentinel_ssl_cert_path }}"
    csr_path: "{{ sentinel_csr_path }}"
    provider: selfsigned

- name: Update postfix main.cf configuration file.
  template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    backup: yes
    owner: root
    group: root
    mode: 0644

- name: Restart postfix.
  service:
    name: postfix
    state: restarted

- name: Ensure postfix is started and enabled at boot.
  service:
    name: postfix
    state: started
    enabled: yes

- name: get latest release info
  uri:
    url: "https://api.github.com/repos/AegisAX/Sentinel/releases/latest"
    return_content: true
  register: latest_json_reponse

- name: Download latest Sentinel .zip file.
  get_url:
    validate_certs: True
    url: "https://github.com/AegisAX/Sentinel/releases/download/{{ latest_json_reponse.json.tag_name }}/sentinel-{{ latest_json_reponse.json.tag_name }}-linux-64bit.zip"
    dest: "/home/{{ sentinel_user }}/sentinel.zip"
    mode: 0755
    owner: "{{ sentinel_user }}"
    group: "{{ sentinel_user }}"

- name: Ensure sentinel user has permission for CRT file.
  file:
    path: "{{ sentinel_crt_path }}"
    mode: 0755
    owner: "{{ sentinel_user }}"
    group: "{{ sentinel_user }}"

- name: Ensure sentinel user has permission for SSL certificate.
  file:
    path: "{{ sentinel_ssl_cert_path }}"
    mode: 0755
    owner: "{{ sentinel_user }}"
    group: "{{ sentinel_user }}"

- name: Create directory for sentinel.
  file:
    path: "/home/{{ sentinel_user }}/sentinel_deploy"
    state: directory
    mode: 0755
    owner: "{{ sentinel_user }}"
    group: "{{ sentinel_user }}"

- name: Unzip sentinel file.
  unarchive:
    src: "/home/{{ sentinel_user }}/sentinel.zip"
    dest: "/home/{{ sentinel_user }}/sentinel_deploy"
    remote_src: True # File is on target server and not locally.
    owner: "{{ sentinel_user }}"
    group: "{{ sentinel_user }}"

- name: Change ownership of Sentinel folder and files.
  file:
    path: /home/{{ sentinel_user }}/sentinel_deploy
    owner: "{{ sentinel_user }}"
    group: "{{ sentinel_user }}"
    recurse: True

- name: Ensure sentinel binary is executable
  file:
    path: /home/{{ sentinel_user }}/sentinel_deploy/sentinel
    mode: 744

- name: Ensure sentinel binary is allowed to bind to privileged ports using setcap
  capabilities:
    path: /home/{{ sentinel_user }}/sentinel_deploy/sentinel
    capability: cap_net_bind_service+eip
    state: present

- name: Copy config.json file.
  copy:
    src: files/config.json
    dest: "/home/{{ sentinel_user }}/sentinel_deploy/config.json"
    owner: "{{ sentinel_user }}"
    group: "{{ sentinel_user }}"
    mode: 0644

- name: Ensure sentinel service file is properly set
  template:
    src: sentinel.service.j2
    dest: /etc/systemd/system/sentinel.service
    mode: 644

- name: Ensure systemd to reread configs
  systemd:
    daemon_reload: yes

- name: Ensure sentinel is properly started
  service:
    name: sentinel.service
    state: started
    enabled: yes

- name: Ensure nginx is installed
  package:
    name: nginx
    state: present

- name: Ensure nginx service file is properly set
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: 644

- name: Ensure nginx service is restarted
  service:
    name: nginx
    state: reloaded
    enabled: yes

- name: get Sentinel log file which contain initial password
  command: cat /home/{{ sentinel_user }}/sentinel_deploy/sentinel.log
  register: sentinel_log

- name: display log file
  debug:
    msg: "{{ sentinel_log }}"

- name: Reboot the box in 1 minute.
  command: shutdown -r 1
  when: reboot_box
