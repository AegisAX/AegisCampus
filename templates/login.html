{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AegisCampus - Cybersecurity Training &amp; Simulation Platform">
    <meta name="author" content="AegisAX (https://github.com/AegisAX)">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="shortcut icon" href="/images/favicon.ico">

    <title>AegisCampus - {{ .Title }}</title>

    <link href="/css/dist/aegiscampus.css" rel="stylesheet">
</head>

<body>
    <div class="navbar navbar-inverse navbar-fixed-top" role="navigation">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="/" style="display: flex; align-items: center; gap: 6px; height: 53px; padding-top: 0; padding-bottom: 0;">
                    <img class="navbar-logo" src="/images/aegiscampus_mark_dark.svg" height="36" alt="" />
                    <span>AegisCampus</span>
                </a>
            </div>
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li>
                        <a id="login-button" href="/login">
                            <button type="button" class="btn btn-primary">Login</button>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="container">
        <form class="form-signin" action="" method="POST">
            <div id="logo" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="/images/aegiscampus_mark.svg" height="56" alt="" />
                <span style="font-family: 'Open Sans', sans-serif; font-size: 28px; font-weight: 700; color: #3F3D7A;">AegisCampus</span>
            </div>
            <h2 class="form-signin-heading">Please sign in</h2>
            {{template "flashes" .Flashes}}
            <input type="text" name="username" class="form-control top-input" placeholder="Username" required autofocus>
            <input type="password" name="password" class="form-control bottom-input" placeholder="Password" autocomplete="off" required>
            <input type="hidden" name="csrf_token" value="{{.Token}}" />
            <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
        </form>
    </div>
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/vendor.min.js"></script>
</body>

</html>
{{ end }}
