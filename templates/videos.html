{{ define "body" }}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
  <div class="row">
    <h1 class="page-header">Video Management</h1>
  </div>

  <div class="row">
    <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#uploadModal">
      <i class="fa fa-plus"></i> New Video
    </button>
  </div>
  &nbsp;

  <div id="loading"><i class="fa fa-spinner fa-spin"></i> Loading...</div>

  <div id="emptyMessage" class="row" style="display:none;">
    <div class="alert alert-info">No videos yet. Let's upload one!</div>
  </div>

  <!-- 유튜브 스타일 카드 그리드 -->
  <div id="videos-grid" class="video-grid" style="display:none;"></div>
</div>

<!-- Upload Modal -->
<div class="modal fade" id="uploadModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <form id="video-upload-form" enctype="multipart/form-data">
      <!-- CSRF: gorilla/csrf는 폼 필드를 지원하므로 그대로 담아 보냅니다 -->
      <input type="hidden" name="csrf_token" value="{{ .Token }}">
      <input type="hidden" id="video-duration-seconds" name="duration_seconds" value="0">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Video Registration</h4>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="video-name">Title</label>
            <input type="text" id="video-name" name="name" class="form-control" placeholder="Title">
          </div>
          <div class="form-group">
            <label for="video-description">Description</label>
            <textarea class="form-control" id="video-description" name="description"></textarea>
          </div>
          <div class="form-group">
            <label for="video-file">Video File</label>
            <input type="file" class="form-control" id="video-file" name="file" accept="video/*" required>
          </div>

          <!-- 업로드 진행 UI -->
          <div id="upload-status" class="text-muted small" style="display:none;">Uploading…</div>
          <div id="upload-progress" class="progress" style="display:none; margin-top:6px;">
            <div id="upload-progress-bar" class="progress-bar" role="progressbar"
                 aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width:0%">0%</div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-upload" class="btn btn-default" data-dismiss="modal">Cancel</button>
          <button type="submit" id="btn-start-upload" class="btn btn-primary">Upload</button>
        </div>
      </div>
    </form>
  </div>
</div>
{{ end }}

{{ define "scripts" }}
<style>
  /* Grid layout */
  .video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    grid-gap:16px;
  }
  .video-card{
    background:#fff; border:1px solid #e9ecef; border-radius:10px; overflow:visible;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  /* 16:9 thumb area */
  .video-thumb{ position:relative; width:100%; padding-top:56.25%; overflow:hidden; cursor:pointer; background:#000; }
  .video-thumb img,
  .video-thumb video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .video-thumb .duration{ position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.75); color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; }
  .video-thumb .overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px; opacity:0; transition:opacity .15s ease; text-shadow:0 2px 6px rgba(0,0,0,.25); }
  .video-thumb:hover .overlay{ opacity:1; }
  .video-thumb.playing .duration{ display:none; }

  /* meta under thumbnail */
  .video-meta{ padding:10px 12px 12px; }
  .meta-head{ display:flex; align-items:center; gap:8px; }
  .video-title{ flex:1; font-weight:600; font-size:15px; color:#1f2d3d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kebab .dropdown-menu{ min-width:160px; }
  .kebab .dropdown-menu li > a{ cursor:pointer; }
  .video-sub{ color:#6c757d; margin-top:4px; font-size:12px; }
  .video-desc{ margin-top:6px; color:#333; font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
</style>
<script src="/js/dist/app/videos.min.js"></script>
{{ end }}
